name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests parse and agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Every manifest is valid JSON
        run: |
          for f in plugin.json gemini-extension.json .codex-plugin/plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            python3 -m json.tool "$f" > /dev/null
            echo "ok $f"
          done

      - name: Versions match the canonical manifest
        run: python3 scripts/sync_versions.py --check

      - name: Release script parses
        run: bash -n scripts/publish_release.sh

      - name: The skill is where every client looks for it
        run: test -f skills/agentic-readiness-assessment/SKILL.md

  claude:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate . --strict

  release:
    name: Tag and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [manifests, claude]
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_release.sh
