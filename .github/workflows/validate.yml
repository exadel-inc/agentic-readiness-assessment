name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests parse and agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every manifest is valid JSON
        run: |
          for f in plugin.json .codex-plugin/plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            python3 -m json.tool "$f" > /dev/null
            echo "ok $f"
          done

      - name: Versions match the canonical manifest
        run: python3 .github/scripts/sync_versions.py --check

      - name: Release script parses
        run: bash -n .github/scripts/publish_release.sh

      - name: The skills are where every client looks for them
        run: |
          test -f skills/agentic-readiness-assessment/SKILL.md
          test -f skills/agent-tool-call-latency/SKILL.md

  tests:
    name: Skill script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run each skill's tests
        run: |
          for t in skills/*/tests; do
            python3 -m unittest discover -s "$t"
          done

  claude:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate . --strict

  release:
    name: Tag and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [manifests, claude]
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-release
      cancel-in-progress: false
      # Without max, a third push cancels the pending run, and a version bump in it is never released.
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish_release.sh
