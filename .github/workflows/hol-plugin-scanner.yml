name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@011b0f4e0ad6d53298d158c842177f196a1b460d # v1.2.688
        with:
          plugin_dir: "."
          mode: scan
          profile: public-marketplace
          min_score: 80
          fail_on_severity: high
          install_cisco: "true"
          cisco_skill_scan: "on"
          cisco_policy: balanced
          online: "false"
          upload_sarif: "false"
          submission_enabled: "false"
          pr_comment: "off"
