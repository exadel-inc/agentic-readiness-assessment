name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check or record the CLA signature
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Ensure CLA signatures branch exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          ref_endpoint="repos/$GH_REPO/git/ref/heads/cla-signatures"

          if gh api "$ref_endpoint" --silent; then
            echo "cla-signatures already exists."
            exit 0
          fi

          main_sha=$(gh api \
            "repos/$GH_REPO/git/ref/heads/main" \
            --jq '.object.sha')

          if gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref='refs/heads/cla-signatures' \
            -f sha="$main_sha" \
            --silent; then
            echo "Created cla-signatures."
          else
            # Another workflow run may have created it concurrently.
            gh api "$ref_endpoint" --silent
          fi

      - name: CLA assistant
        # Pinned to a specific commit to prevent tag changes
        # from changing the code executed by this workflow.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/exadel-inc/agentic-readiness-assessment/blob/main/CLA.md
          branch: cla-signatures
          allowlist: '*[bot]'
          custom-notsigned-prcomment: >-
            Thank you for the contribution. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/exadel-inc/agentic-readiness-assessment/blob/main/CLA.md)
            and accept it by posting the sentence below as a comment on this pull request.
            You only ever do this once, and it covers every contribution you make to this repository.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Every contributor on this pull request has signed the CLA.
          lock-pullrequest-aftermerge: false